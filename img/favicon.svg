<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="badge-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="70%" stop-color="#e62e24" />
      <stop offset="100%" stop-color="#c00014" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Ring -->
  <circle cx="256" cy="256" r="248" fill="#121414" stroke="#ff3b30" stroke-width="12" />

  <!-- Inner High-Contrast Red Badge -->
  <circle cx="256" cy="256" r="216" fill="url(#badge-grad)" />

  <!-- White Accent Line -->
  <line x1="80" y1="315" x2="432" y2="315" stroke="#ffffff" stroke-width="8" opacity="0.9" />

  <!-- Silueta Carrocería Fiat Palio (Arco Superior de Techo) -->
  <path d="M 115 260 C 180 145, 332 145, 397 260" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#shadow)" />

  <!-- Texto Principal: PALIO (Montserrat / Eurostile Style Bold) -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-style="italic" 
        font-weight="900" 
        font-size="94" 
        fill="#ffffff" 
        letter-spacing="-1px"
        filter="url(#shadow)">
    PALIO
  </text>
</svg>
